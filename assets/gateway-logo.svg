<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ee6b0"/>
      <stop offset="100%" stop-color="#29c99a"/>
    </linearGradient>
    <linearGradient id="mintSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ee6b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#29c99a" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="18%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#123328" stop-opacity="1"/>
      <stop offset="100%" stop-color="#081410" stop-opacity="1"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="wideBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- card background -->
  <rect x="0" y="0" width="1200" height="340" rx="28" fill="url(#cardGlow)"/>

  <!-- faint constellation, suggesting a network, kept sparse and quiet -->
  <g stroke="#3ee6b0" stroke-opacity="0.22" stroke-width="1.5">
    <line x1="330" y1="70" x2="410" y2="118"/>
    <line x1="410" y1="118" x2="392" y2="205"/>
    <line x1="392" y1="205" x2="470" y2="255"/>
  </g>
  <g fill="#3ee6b0" fill-opacity="0.55">
    <circle cx="330" cy="70" r="3"/>
    <circle cx="410" cy="118" r="2.4"/>
    <circle cx="392" cy="205" r="2.4"/>
    <circle cx="470" cy="255" r="3"/>
  </g>

  <!-- portal / gateway mark -->
  <!-- wide soft glow, behind everything -->
  <path d="M 100 280 L 100 150 A 90 90 0 0 1 190 60 L 190 60 A 90 90 0 0 1 280 150 L 280 280"
        fill="none" stroke="url(#mint)" stroke-width="30" stroke-opacity="0.35"
        stroke-linecap="round" filter="url(#wideBlur)"/>

  <!-- outer arch -->
  <path d="M 100 280 L 100 150 A 90 90 0 0 1 190 60 L 190 60 A 90 90 0 0 1 280 150 L 280 280"
        fill="none" stroke="url(#mint)" stroke-width="14" stroke-linecap="round"/>

  <!-- inner arch, brighter, offset inward — the "opening" -->
  <path d="M 132 280 L 132 158 A 58 58 0 0 1 190 100 A 58 58 0 0 1 248 158 L 248 280"
        fill="none" stroke="url(#mintSoft)" stroke-width="8" stroke-linecap="round"
        opacity="0.9"/>

  <!-- threshold line at the base, grounding the shape -->
  <line x1="88" y1="282" x2="292" y2="282" stroke="#3ee6b0" stroke-width="4"
        stroke-linecap="round" opacity="0.5"/>

  <!-- wordmark -->
  <text x="345" y="205" font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="118" letter-spacing="1" fill="#f4fdf9">Gateway</text>
</svg>
